<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEFAME · Truth Verification Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Orbitron:wght@500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-amber: #fbbf24;
            --neon-cyan: #06b6d4;
            --neon-red: #f87171;
            --neon-green: #34d399;
            --bg-deep: #0a0e1a;
            --bg-panel: #151b2e;
            --text-primary: #e8edf5;
            --text-dim: #8b92a8;
            --border-glow: rgba(251, 191, 36, 0.3);
            --grid-color: rgba(251, 191, 36, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScroll 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridScroll {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(50px);
            }
        }

        /* Noise texture overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        .app-wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 2rem 0 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(251, 191, 36, 0.2);
            margin-bottom: 3rem;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-amber), transparent);
            box-shadow: 0 0 10px var(--neon-amber);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            background: linear-gradient(135deg, var(--neon-amber) 0%, var(--neon-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.5);
            margin-bottom: 0.5rem;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {

            0%,
            100% {
                filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6));
            }

            50% {
                filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.9));
            }
        }

        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 500;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 4rem;
        }

        /* Terminal Panel */
        .terminal-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            box-shadow:
                0 0 30px rgba(251, 191, 36, 0.15),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
            padding: 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .terminal-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    var(--neon-amber),
                    var(--neon-cyan),
                    transparent);
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(139, 146, 168, 0.2);
        }

        .panel-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--neon-amber), var(--neon-cyan));
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--neon-amber);
        }

        /* Input Section */
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--neon-cyan);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            padding: 1.25rem;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid rgba(139, 146, 168, 0.3);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            min-height: 120px;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--neon-amber);
            box-shadow:
                0 0 0 1px var(--neon-amber),
                0 0 20px rgba(251, 191, 36, 0.2);
            background: rgba(10, 14, 26, 0.95);
        }

        textarea::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }

        /* Button */
        .verify-btn {
            margin-top: 1.5rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--neon-amber), #f59e0b);
            border: none;
            color: var(--bg-deep);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
        }

        .verify-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .verify-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .verify-btn:hover {
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.7);
            transform: translateY(-2px);
        }

        .verify-btn:active {
            transform: translateY(0);
        }

        .verify-btn:disabled {
            background: linear-gradient(135deg, #4b5563, #6b7280);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        /* Thought Process */
        .process-timeline {
            position: relative;
            padding-left: 2.5rem;
        }

        .process-timeline::before {
            content: '';
            position: absolute;
            left: 0.75rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--neon-cyan), transparent);
        }

        .process-step {
            position: relative;
            margin-bottom: 2rem;
            opacity: 0;
            animation: stepFadeIn 0.6s forwards;
        }

        @keyframes stepFadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .process-step::before {
            content: '';
            position: absolute;
            left: -1.85rem;
            top: 0.3rem;
            width: 12px;
            height: 12px;
            background: var(--bg-panel);
            border: 2px solid var(--text-dim);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .process-step.active::before {
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            color: var(--neon-cyan);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .step-body {
            background: rgba(10, 14, 26, 0.6);
            padding: 1rem;
            border-left: 2px solid rgba(6, 182, 212, 0.3);
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-dim);
            white-space: pre-wrap;
        }

        /* Result Panel */
        .result-verdict {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            padding: 1.5rem;
            background: rgba(10, 14, 26, 0.5);
            border-left: 4px solid var(--neon-amber);
        }

        .verdict-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .verdict-badge {
            padding: 0.75rem 2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .verdict-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .verdict-SUPPORTED {
            background: rgba(52, 211, 153, 0.15);
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.3);
        }

        .verdict-REFUTED {
            background: rgba(248, 113, 113, 0.15);
            color: var(--neon-red);
            border: 2px solid var(--neon-red);
            box-shadow: 0 0 30px rgba(248, 113, 113, 0.3);
        }

        .verdict-NEI {
            background: rgba(139, 146, 168, 0.15);
            color: var(--text-dim);
            border: 2px solid var(--text-dim);
        }

        .section-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--neon-amber);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .justification-content {
            background: rgba(10, 14, 26, 0.5);
            padding: 1.75rem;
            border-left: 3px solid var(--neon-cyan);
            line-height: 1.8;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        /* Evidence Grid */
        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
            list-style: none;
        }

        .evidence-item {
            background: rgba(10, 14, 26, 0.7);
            border: 1px solid rgba(139, 146, 168, 0.2);
            padding: 1.25rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .evidence-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--neon-cyan);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .evidence-item:hover {
            border-color: var(--neon-cyan);
            transform: translateX(5px);
            box-shadow: -5px 0 20px rgba(6, 182, 212, 0.2);
        }

        .evidence-item:hover::before {
            transform: scaleY(1);
        }

        .evidence-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 0.75rem;
        }

        .evidence-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--neon-amber);
            text-decoration: none;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .evidence-link:hover {
            color: var(--neon-cyan);
            gap: 0.75rem;
        }

        /* Utility */
        .hidden {
            display: none;
        }

        .spinner {
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid rgba(10, 14, 26, 0.5);
            border-radius: 50%;
            border-top-color: var(--bg-deep);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .tagline {
                font-size: 0.7rem;
            }

            .terminal-panel {
                padding: 1.5rem;
            }

            .evidence-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-wrapper">
        <header class="header">
            <h1 class="logo">DEFAME</h1>
            <p class="tagline">Truth Verification Terminal</p>
        </header>

        <div class="container">
            <!-- Input Panel -->
            <div class="terminal-panel">
                <div class="panel-header">
                    <div class="panel-icon">
                        <i class="fa-solid fa-terminal"></i>
                    </div>
                    <h2 class="panel-title">Claim Analysis</h2>
                </div>

                <label for="claim">Input Statement for Verification</label>
                <textarea id="claim"
                    placeholder="Enter claim to verify (e.g., VNG is the first Vietnamese tech company listed on NASDAQ...)"></textarea>

                <button class="verify-btn" id="checkBtn" onclick="checkClaim()">
                    <span class="btn-content">
                        <span>Initiate Verification</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </span>
                </button>
            </div>

            <!-- Thought Process -->
            <div class="terminal-panel hidden" id="logCard">
                <div class="panel-header">
                    <div class="panel-icon">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <h2 class="panel-title">Processing Pipeline</h2>
                </div>
                <div class="process-timeline" id="thoughtProcess">
                    <!-- Dynamic steps -->
                </div>
            </div>

            <!-- Results -->
            <div class="terminal-panel hidden" id="resultCard">
                <div class="panel-header">
                    <div class="panel-icon">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <h2 class="panel-title">Verification Result</h2>
                </div>

                <div class="result-verdict">
                    <span class="verdict-label">Final Verdict</span>
                    <div id="verdictBadge" class="verdict-badge"></div>
                </div>

                <h3 class="section-header">
                    <i class="fa-solid fa-file-lines"></i>
                    Analysis
                </h3>
                <div id="justificationText" class="justification-content"></div>

                <h3 class="section-header">
                    <i class="fa-solid fa-database"></i>
                    Evidence Sources
                </h3>
                <ul id="evidenceList" class="evidence-grid"></ul>
            </div>
        </div>
    </div>

    <script>
        const claimInput = document.getElementById('claim');
        const checkBtn = document.getElementById('checkBtn');
        const logCard = document.getElementById('logCard');
        const thoughtProcess = document.getElementById('thoughtProcess');
        const resultCard = document.getElementById('resultCard');
        const verdictBadge = document.getElementById('verdictBadge');
        const justificationText = document.getElementById('justificationText');
        const evidenceList = document.getElementById('evidenceList');

        async function checkClaim() {
            const claim = claimInput.value.trim();
            if (!claim) return;

            // Reset UI
            checkBtn.disabled = true;
            checkBtn.innerHTML = '<span class="btn-content"><span class="spinner"></span> Processing...</span>';
            logCard.classList.remove('hidden');
            resultCard.classList.add('hidden');
            thoughtProcess.innerHTML = '';

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ claim })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            const [meta, ...dataParts] = line.split('\n');
                            const eventType = meta.replace('event: ', '').trim();
                            const dataStr = dataParts.map(p => p.replace('data: ', '')).join('\n').trim();

                            if (!dataStr) continue;
                            const data = JSON.parse(dataStr);

                            if (eventType === 'log') {
                                addThoughtStep(data.message);
                            } else if (eventType === 'result') {
                                showResult(data);
                            } else if (eventType === 'error') {
                                addThoughtStep("ERROR: " + data.error, true);
                                checkBtn.disabled = false;
                                checkBtn.innerHTML = '<span class="btn-content"><span>Initiate Verification</span><i class="fa-solid fa-chevron-right"></i></span>';
                            }
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                addThoughtStep("Connection error: Unable to reach verification server.", true);
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<span class="btn-content"><span>Initiate Verification</span><i class="fa-solid fa-chevron-right"></i></span>';
            }
        }

        function addThoughtStep(msg, isError = false) {
            msg = msg.trim();
            if (!msg) return;

            let icon = 'fa-microchip';
            let title = 'Processing';

            if (msg.toLowerCase().includes('interpreting')) { icon = 'fa-file-magnifying-glass'; title = 'Claim Interpretation'; }
            else if (msg.toLowerCase().includes('searching')) { icon = 'fa-globe'; title = 'Web Search'; }
            else if (msg.toLowerCase().includes('answering')) { icon = 'fa-comments'; title = 'Query Response'; }
            else if (msg.toLowerCase().includes('verifying')) { icon = 'fa-list-check'; title = 'Verification'; }
            else if (msg.toLowerCase().includes('verdict')) { icon = 'fa-scale-balanced'; title = 'Final Analysis'; }

            if (isError) { icon = 'fa-triangle-exclamation'; title = 'Error'; }

            const div = document.createElement('div');
            div.className = 'process-step active';
            div.innerHTML = `
                <div class="step-header">
                    <i class="fa-solid ${icon}"></i>
                    <span>${title}</span>
                </div>
                <div class="step-body">${msg}</div>
            `;

            const prev = thoughtProcess.querySelector('.process-step.active');
            if (prev) prev.classList.remove('active');

            thoughtProcess.appendChild(div);
        }

        function showResult(result) {
            checkBtn.disabled = false;
            checkBtn.innerHTML = '<span class="btn-content"><span>Initiate Verification</span><i class="fa-solid fa-chevron-right"></i></span>';
            resultCard.classList.remove('hidden');

            // Verdict
            const verdict = result.verdict || "UNKNOWN";
            verdictBadge.textContent = verdict;
            verdictBadge.className = `verdict-badge verdict-${verdict}`;

            // Justification
            let justify = result.justification || "No analysis provided.";
            justify = justify
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" style="color: var(--neon-cyan); text-decoration: underline;">$1</a>')
                .replace(/\n/g, '<br>');
            justificationText.innerHTML = justify;

            // Evidence
            evidenceList.innerHTML = '';
            const evidences = result.evidences || [];
            if (evidences.length === 0) {
                evidenceList.innerHTML = '<li class="evidence-item"><div class="evidence-text">No evidence sources available.</div></li>';
            } else {
                evidences.forEach(evObj => {
                    const li = document.createElement('li');
                    li.className = 'evidence-item';

                    let content = typeof evObj === 'string' ? evObj : evObj.text;
                    let url = typeof evObj === 'object' ? evObj.url : null;

                    content = content.replace(/\*\*/g, '');

                    let html = `<div class="evidence-text">${content}</div>`;
                    if (url) {
                        html += `<a href="${url}" target="_blank" class="evidence-link">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            <span>${url}</span>
                        </a>`;
                    }

                    li.innerHTML = html;
                    evidenceList.appendChild(li);
                });
            }

            resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>

</html>
